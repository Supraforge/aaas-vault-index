name: Release

# Auto-generated by release_bootstrap (scripts/release/release_bootstrap.py in
# AaaS-Love/.claude) — edit freely. Fires when a vX.Y.Z tag is pushed; cut tags
# with the release engine: python3 ~/.claude/scripts/release/release.py
# --project <this repo> --bump patch|minor|major --yes

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout at tag
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate VERSION matches tag (when a VERSION file exists)
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ -f VERSION ]]; then
            V="$(tr -d '[:space:]' < VERSION)"
            if [[ "v${V}" != "${TAG}" ]]; then
              echo "::error::VERSION file (${V}) does not match tag (${TAG})"
              exit 1
            fi
          fi

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" --generate-notes --verify-tag
